<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Salma App</title>

  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="icon.png?v=2.13">
  
  <!-- iPhone Home Screen Icon & App Settings -->
  <link rel="apple-touch-icon" href="icon.png?v=2.13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salma App">
  
  <!-- Fonts: Tajawal (Primary for Arabic), Quicksand (Secondary UI), Dancing Script (Header) -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* DEFAULT: DARK MODE (Charcoal & Muted Plum) */
    :root {
      --bg-color: #121212; 
      --surface: #1C1C1E; 
      --primary: #9D6587; /* Muted Plum / Amethyst */
      --primary-hover: #865271;
      --primary-soft: rgba(157, 101, 135, 0.15); 
      --text-main: #FFFFFF; 
      --text-muted: #8E8E93; 
      --border-color: #2C2C2E; 
      --delete-bg: #FF3B30; 
      --surface-glass: rgba(28, 28, 30, 0.85); 
      --safe-area-top: env(safe-area-inset-top, 20px);
      --safe-area-bottom: env(safe-area-inset-bottom, 20px);
      
      /* Bento Box Dark Mode Variables */
      --bento-dates-bg: linear-gradient(135deg, #2A1B24 0%, #1C1C1E 100%);
      --bento-todo-bg: linear-gradient(135deg, #1A202C 0%, #1C1C1E 100%);
      --bento-wish-bg: linear-gradient(135deg, #2D221B 0%, #1C1C1E 100%);
      --bento-border: rgba(255, 255, 255, 0.05);
      --modal-bg: rgba(0, 0, 0, 0.7);
      --preview-bg: rgba(0, 0, 0, 0.2);
    }

    /* OVERRIDE: LIGHT MODE */
    :root.light-theme {
      --bg-color: #F8F9FA;
      --surface: #FFFFFF;
      --primary: #FFB6C1; 
      --primary-hover: #FF91A4;
      --primary-soft: #FFE4E1;
      --text-main: #2D3748;
      --text-muted: #718096;
      --border-color: #EDF2F7;
      --delete-bg: #FF3B30;
      --surface-glass: rgba(255, 255, 255, 0.85);
      
      /* Bento Box Light Mode Variables */
      --bento-dates-bg: linear-gradient(135deg, #FFE4E1 0%, #FFFFFF 100%);
      --bento-todo-bg: linear-gradient(135deg, #E6FFFA 0%, #FFFFFF 100%);
      --bento-wish-bg: linear-gradient(135deg, #FEFCBF 0%, #FFFFFF 100%);
      --bento-border: rgba(0, 0, 0, 0.03);
      --modal-bg: rgba(255, 255, 255, 0.4);
      --preview-bg: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100dvh; 
      background: var(--bg-color); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", 'Tajawal', 'Quicksand', sans-serif;
      overflow: hidden; 
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .app-container {
      width: 100%; height: 100dvh; 
      display: flex; flex-direction: column; position: relative;
    }

    /* Global Header */
    .global-header {
      padding: calc(var(--safe-area-top) + 15px) 25px 15px;
      background: var(--surface-glass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 100; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center; 
      position: relative; flex-shrink: 0;
    }

    .header-btn {
      position: absolute; background: transparent; border: none;
      width: 40px; height: 40px;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.3rem; color: var(--primary); cursor: pointer;
      transition: transform 0.2s, opacity 0.2s; z-index: 2;
    }
    .header-btn:active { transform: scale(0.9); }
    .header-left { left: 15px; } .header-right { right: 15px; }

    .header-title {
      font-family: 'Dancing Script', cursive; color: var(--primary);
      font-size: 2.2rem; margin: 0; font-weight: 700; transition: opacity 0.3s ease;
    }

    .view-container { flex-grow: 1; position: relative; overflow: hidden; }
    .view {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; opacity: 0; pointer-events: none;
      transform: translateX(20px); transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow-y: auto; overflow-x: hidden; padding-bottom: var(--safe-area-bottom);
    }
    .view.active { opacity: 1; pointer-events: auto; transform: translateX(0); }

    .greeting-section {
      padding: 25px 20px 5px;
    }
    .greeting-section h2 {
      margin: 0; font-size: 2.2rem; font-weight: 800; color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .greeting-section p {
      margin: 5px 0 0 0; font-size: 1.05rem; color: var(--text-muted); font-weight: 500;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 15px 20px 25px;
    }

    .bento-card {
      background: var(--surface);
      border: 1px solid var(--bento-border);
      border-radius: 28px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .bento-card:active {
      transform: scale(0.95);
    }

    .bento-card-bg-icon {
      position: absolute;
      right: -15px;
      bottom: -15px;
      font-size: 7rem;
      opacity: 0.04;
      pointer-events: none;
      transform: rotate(-15deg);
    }

    .bento-wide { grid-column: span 2; }
    .bento-square { height: 145px; } /* Replaced aspect-ratio to prevent huge squares */
    
    .bento-dates { background: var(--bento-dates-bg); }
    .bento-todo { background: var(--bento-todo-bg); }
    .bento-wishlist { background: var(--bento-wish-bg); }

    .todo-wide-layout {
      display: flex; gap: 15px; align-items: center; margin-top: 5px; z-index: 1;
    }
    .todo-wide-layout .bento-number-wrapper { flex-grow: 0; min-width: 50px; }
    .todo-wide-layout .bento-preview { margin-top: 0; flex-grow: 1; }

    .bento-title-row {
      display: flex; justify-content: space-between; align-items: flex-start;
    }

    .bento-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
      display: flex; align-items: center; gap: 8px; text-transform: uppercase;
      letter-spacing: 1px;
    }
    .bento-title i { color: var(--primary); font-size: 1.1rem; }

    .bento-dates-content {
      display: flex; flex-direction: column; justify-content: center; flex-grow: 1; margin-top: 10px; z-index: 1;
    }
    .bento-date-hero {
      display: flex; align-items: baseline; gap: 4px; justify-content: flex-end;
    }
    .bento-date-hero .day-num {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.4rem; font-weight: 600; color: var(--primary); line-height: 1;
    }
    .bento-date-hero .month-str {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted); line-height: 1; text-transform: uppercase;
    }
    .bento-date-context {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem; color: var(--text-main); font-weight: 500; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Widget Core Elements */
    .bento-text-box {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem; font-weight: 600; color: var(--text-main);
      background: var(--preview-bg); padding: 10px 14px; border-radius: 12px;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      margin: auto 0; text-align: left;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.4; word-break: break-word; width: 100%;
    }
    .bento-bottom-stats {
      display: flex; align-items: baseline; gap: 6px; justify-content: flex-start; margin-top: auto;
    }
    .bento-bottom-stats .stats-num {
      font-family: 'Quicksand', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text-main); line-height: 1;
    }
    .bento-bottom-stats .stats-label {
      font-family: 'Quicksand', sans-serif; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; line-height: 1;
    }

    .list-controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px 5px; flex-shrink: 0; }
    .section-title { font-weight: 700; color: var(--text-main); font-size: 1.2rem; }
    select {
      border: none; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.9rem;
      font-weight: 600; outline: none; cursor: pointer; text-align: right;
    }
    select option { background: var(--surface); color: var(--text-main); }
    .list-container { list-style: none; padding: 10px 25px 25px; margin: 0; flex-grow: 1; }

    .list-item-wrapper {
      position: relative; margin-bottom: 15px; border-radius: 24px;
      background: var(--delete-bg); animation: slideUp 0.4s ease-out forwards;
      opacity: 0; transform: translateY(20px);
    }
    .delete-bg {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      display: flex; justify-content: flex-end; align-items: center;
      padding-inline-end: 25px; color: white; font-size: 1.3rem;
      z-index: 1; cursor: pointer; border-radius: 24px;
    }
    .list-item {
      display: flex; align-items: center; background: var(--surface);
      padding: 16px 20px; border-radius: 24px; border: 1px solid var(--border-color);
      position: relative; z-index: 2; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, border-color 0.3s;
      width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .list-item.completed { background: var(--bg-color); border-color: transparent; }

    .checkbox-wrapper { position: relative; width: 24px; height: 24px; margin-inline-end: 15px; flex-shrink: 0; cursor: pointer; }
    .checkbox-wrapper input { opacity: 0; width: 0; height: 0; position: absolute; }
    .custom-checkbox {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: 2px solid var(--primary); border-radius: 50%; background: transparent; transition: all 0.2s ease;
      display: flex; justify-content: center; align-items: center;
    }
    .custom-checkbox::after {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      color: white; font-size: 11px; opacity: 0; transform: scale(0.5); transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .checkbox-wrapper input:checked ~ .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .checkbox-wrapper input:checked ~ .custom-checkbox::after { opacity: 1; transform: scale(1); }

    .item-text { flex: 1; font-weight: 600; word-break: break-word; transition: color 0.3s; color: var(--text-main); display: flex; flex-direction: column; line-height: 1.3; }
    .item-text .main-text { font-size: 1.05rem; }
    .item-text .date-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; font-weight: 500; }
    .list-item.completed .item-text .main-text { text-decoration: line-through; color: var(--text-muted); }

    .actions { display: flex; gap: 8px; flex-shrink: 0; margin-inline-start: 10px; }
    .actions button {
      background: var(--bg-color); border-radius: 50%; width: 34px; height: 34px;
      display: flex; justify-content: center; align-items: center; border: none;
      color: var(--text-muted); font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .actions button:hover { background: var(--primary-soft); color: var(--primary); transform: scale(1.1); }
    
    .input-wrapper {
      padding: 15px 25px calc(var(--safe-area-bottom) + 15px); background: var(--surface);
      border-top: 1px solid var(--border-color); z-index: 10; flex-shrink: 0;
    }
    .input-group {
      display: flex; gap: 10px; background: var(--bg-color); padding: 8px;
      border-radius: 30px; border: 1px solid transparent; transition: all 0.3s; align-items: center;
    }
    .input-group:focus-within { border-color: var(--primary-soft); }
    input[type="text"] {
      flex: 1; padding: 10px 15px; border: none; background: transparent;
      font-size: 1rem; font-weight: 600; font-family: inherit; color: var(--text-main); outline: none;
    }
    input[type="text"]::placeholder { color: var(--text-muted); font-weight: 500; }
    .btn-cancel {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 1.2rem; cursor: pointer; padding: 0 5px; display: none; transition: color 0.2s;
    }
    .btn-cancel:hover { color: var(--delete-bg); }
    button.btn-main {
      background: var(--primary); color: white; border: none; border-radius: 24px;
      padding: 0 20px; height: 42px; font-size: 1rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s; white-space: nowrap;
    }
    button.btn-main:hover { background: var(--primary-hover); transform: scale(1.02); }
    button.btn-main:active { transform: scale(0.95); }
    button.btn-main:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.7; }
    .empty-state { text-align: center; color: var(--text-muted); font-size: 1.1rem; font-weight: 600; padding: 60px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .empty-state i { font-size: 3rem; color: var(--primary-soft); background: var(--bg-color); width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; border-radius: 50%; }

    .calendar-wrapper { padding: 25px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: 700;}
    .cal-nav-group { display: flex; gap: 10px; align-items: center; }
    .cal-nav-btn { background: var(--surface); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 10px; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
    .cal-nav-btn:hover, .cal-nav-btn:active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); transform: scale(0.95); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .calendar-day-name { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; padding-bottom: 10px; }
    
    .calendar-day {
      aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; background: var(--surface); border: 1px solid var(--border-color);
      position: relative;
    }
    .calendar-day:hover, .calendar-day.selected { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
    .calendar-day.empty { background: transparent; border: none; cursor: default; }
    .calendar-day.today { background: var(--primary); color: white; border: none; box-shadow: 0 4px 10px var(--primary-soft); }
    .calendar-day .event-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; position: absolute; bottom: 6px; }
    .calendar-day.today .event-dot { background: white; }

    .events-section { margin-top: 30px; }
    .events-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .events-section-header h3 { margin: 0; font-size: 1.2rem; color: var(--text-main); }
    .add-event-btn { background: var(--primary); color: white; border: none; border-radius: 16px; padding: 8px 16px; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .add-event-btn:active { transform: scale(0.95); }

    .event-card {
      background: var(--bg-color); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color);
      display: flex; align-items: center; gap: 15px; margin-bottom: 10px; position: relative;
    }
    .event-date-box {
      background: var(--primary-soft); color: var(--primary); padding: 10px; 
      border-radius: 12px; font-weight: 700; text-align: center; min-width: 60px;
    }
    .event-details { flex-grow: 1; }
    .event-del-btn, .event-edit-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 10px; font-size: 1.1rem; }
    .event-del-btn:hover { color: var(--delete-bg); }
    .event-edit-btn:hover { color: var(--primary); }

    .menu-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 999;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; left: -320px; width: 300px; height: 100dvh;
      background: var(--surface); z-index: 1000; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; padding: calc(var(--safe-area-top) + 30px) 20px 20px;
      box-shadow: 10px 0 30px rgba(0,0,0,0.3); border-top-right-radius: 30px; border-bottom-right-radius: 30px;
    }
    .side-menu.active { transform: translateX(320px); }
    .side-menu-header { font-family: 'Dancing Script', cursive; font-size: 2.6rem; color: var(--primary); text-align: center; margin-bottom: 30px; }
    .side-menu-links { display: flex; flex-direction: column; gap: 10px; }
    .menu-item {
      display: flex; align-items: center; gap: 15px; padding: 16px 20px; font-size: 1.1rem; 
      font-weight: 700; color: var(--text-main); background: transparent; border: none;
      border-radius: 20px; cursor: pointer; transition: all 0.2s; text-align: left; font-family: inherit;
    }
    .menu-item:hover, .menu-item.active-menu { background: var(--primary-soft); color: var(--primary); }
    .menu-item i { font-size: 1.2rem; width: 25px; text-align: center; }
    .spacer { flex-grow: 1; }
    .menu-bottom-bar { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid var(--border-color); }
    .menu-bottom-icons { display: flex; gap: 10px; }
    .menu-bottom-bar .icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; transition: color 0.3s, transform 0.2s; padding: 10px; border-radius: 50%; }
    .menu-bottom-bar .icon-btn:hover { color: var(--primary); background: var(--primary-soft); transform: scale(1.05); }
    .version-info { color: var(--text-muted); font-size: 1rem; font-weight: 700; letter-spacing: 1px; }
    
    /* Message Box */
    .message-box {
      position: fixed; top: var(--safe-area-top); left: 50%; transform: translateX(-50%) translateY(-150%);
      background: var(--surface); border: 1px solid var(--primary); color: var(--text-main);
      padding: 15px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10000; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1rem;
    }
    .message-box.show { transform: translateX(-50%) translateY(20px); }
    .message-box button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 12px; font-family: inherit; font-weight: bold; cursor: pointer; }

    /* Custom Event Modal */
    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 9999; display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .custom-modal-overlay.show { opacity: 1; pointer-events: auto; }
    .custom-modal {
      background: var(--surface); width: 90%; max-width: 400px;
      border-radius: 32px; padding: 30px 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border-color);
    }
    .custom-modal-overlay.show .custom-modal { transform: scale(1); }
    .modal-title { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 20px; text-align: center; }
    .modal-input {
      width: 100%; padding: 15px; border-radius: 16px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-main); font-family: inherit; font-size: 1rem;
      margin-bottom: 15px; outline: none; transition: border-color 0.2s; font-weight: 600;
    }
    .modal-input:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-modal { flex: 1; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .btn-cancel-modal { background: var(--bg-color); color: var(--text-muted); }
    .btn-cancel-modal:active { background: var(--border-color); }
    .btn-save-modal { background: var(--primary); color: white; }
    .btn-save-modal:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="messageBox" class="message-box">
    <span id="messageText">Error goes here</span>
    <button id="messageClose">OK</button>
  </div>

  <div class="custom-modal-overlay" id="confirmModal">
    <div class="custom-modal">
      <div class="modal-title" dir="auto">Delete Occasion?</div>

        <div class="bento-grid">

              <button class="cal-nav-btn" id="nextMonthBtn"><i class="fas fa-angle-right"></i></button>
              <button class="cal-nav-btn" id="nextYearBtn"><i class="fas fa-angle-double-right"></i></button>

            <!-- Days rendered via JS -->

            <div class="events-section-header">
              <h3 dir="auto" id="selectedDateLabel">Selected Date</h3>
              <button class="add-event-btn" id="openEventModalBtn"><i class="fas fa-plus"></i> Add Occasion</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyES_YyIz54wHVYgHLFg_9gYbhfDz-PyU",
      authDomain: "salma-notes.firebaseapp.com",
      projectId: "salma-notes",
      storageBucket: "salma-notes.firebasestorage.app",
      messagingSenderId: "725168545178",
      appId: "1:725168545178:web:33a80db028670236b52e23"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const leftHeaderBtn = document.getElementById('leftHeaderBtn');
    const headerTitle = document.getElementById('headerTitle');
    const views = document.querySelectorAll('.view');
    const widgets = document.querySelectorAll('.bento-card'); // Updated selector
    const sideMenuItems = document.querySelectorAll('.side-menu-links .menu-item');
    
    // Side Menu Elements
    const openMenuBtnIcon = '<i class="fas fa-bars"></i>';
    const backBtnIcon = '<i class="fas fa-arrow-left"></i>';
    const menuOverlay = document.getElementById('menuOverlay');
    const sideMenu = document.getElementById('sideMenu');
    const refreshBtn = document.getElementById('refreshBtn');
    const themeBtn = document.getElementById('themeBtn');

    // Bento Widget Elements
    const bentoDateNumber = document.getElementById('bentoDateNumber');
    const bentoDateMonth = document.getElementById('bentoDateMonth');
    const bentoDatesContext = document.getElementById('bentoDatesContext');
    
    const bentoTodoCount = document.getElementById('bentoTodoCount');
    const bentoTodoNext = document.getElementById('bentoTodoNext');
    
    const bentoWishCount = document.getElementById('bentoWishCount');
    const bentoWishNext = document.getElementById('bentoWishNext');

    // App State
    let currentView = 'landing';
    let todoItems = [];
    let wishlistItems = [];
    let calendarEvents = [];
    
    // Calendar State
    let currentCalDate = new Date(); // Tracks the month/year being viewed
    let selectedDate = new Date(); // Tracks the specifically tapped day
    let editingEventId = null;
    let deleteTargetId = null;
    
    let editingTodoId = null;
    let editingWishlistId = null;

    // References
    const todoRef = collection(db, "tasks");
    const wishlistRef = collection(db, "wishlist");
    const eventsRef = collection(db, "events");

    // Message Box
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');
    document.getElementById('messageClose').addEventListener('click', () => messageBox.classList.remove('show'));
    function showMessage(text) { messageText.textContent = text; messageBox.classList.add('show'); }

    // Theme Logic
    const savedTheme = localStorage.getItem('salma_theme') || 'dark';
    if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
    function updateThemeBtn() {
      const isLight = document.documentElement.classList.contains('light-theme');
      themeBtn.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    }
    updateThemeBtn();
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('light-theme');
      localStorage.setItem('salma_theme', document.documentElement.classList.contains('light-theme') ? 'light' : 'dark');
      updateThemeBtn();
    });

    // Menu Navigation
    const toggleMenu = () => { sideMenu.classList.toggle('active'); menuOverlay.classList.toggle('active'); };
    menuOverlay.addEventListener('click', toggleMenu);
    refreshBtn.addEventListener('click', () => { refreshBtn.querySelector('i').classList.add('fa-spin'); setTimeout(() => location.reload(), 500); });

    function navigateTo(targetView) {
      currentView = targetView;
      views.forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${targetView}`).classList.add('active');

      sideMenuItems.forEach(item => {
        item.classList.remove('active-menu');
        if (item.getAttribute('data-target') === targetView) item.classList.add('active-menu');
      });

      if (sideMenu.classList.contains('active')) toggleMenu();

      if (targetView === 'landing') {
        headerTitle.textContent = "Salma App";
        leftHeaderBtn.innerHTML = openMenuBtnIcon;
        leftHeaderBtn.onclick = toggleMenu;
        updateGreeting(); // Refresh greeting on return home
      } else {
        leftHeaderBtn.innerHTML = backBtnIcon;
        leftHeaderBtn.onclick = () => navigateTo('landing');
        if (targetView === 'todo') headerTitle.textContent = "To-do";
        if (targetView === 'wishlist') headerTitle.textContent = "Wishlist";
        if (targetView === 'dates') headerTitle.textContent = "Dates";
      }
    }

    // Dynamic Greeting
    function updateGreeting() {
      const hr = new Date().getHours();
      let greeting = "Good evening";
      if (hr < 12) greeting = "Good morning";
      else if (hr < 18) greeting = "Good afternoon";
      document.getElementById('greetingText').textContent = greeting;
    }
    updateGreeting();

    sideMenuItems.forEach(item => { item.addEventListener('click', () => { const t = item.getAttribute('data-target'); if (t) navigateTo(t); }); });
    widgets.forEach(widget => { widget.addEventListener('click', () => { const t = widget.getAttribute('data-target'); if (t) navigateTo(t); }); });
    leftHeaderBtn.onclick = toggleMenu;

    // --- DATES & CALENDAR LOGIC --- //
    const calendarMonthLabel = document.getElementById('calendarMonthLabel');
    const calendarGrid = document.getElementById('calendarGrid');
    const selectedDateLabel = document.getElementById('selectedDateLabel');
    const eventsListContainer = document.getElementById('eventsListContainer');
    
    // Modal
    const eventModal = document.getElementById('eventModal');
    const eventModalTitle = document.getElementById('eventModalTitle');
    const eventTitleInput = document.getElementById('eventTitleInput');
    const eventDateInput = document.getElementById('eventDateInput');
    const confirmModal = document.getElementById('confirmModal');
    
    document.getElementById('cancelConfirmBtn').addEventListener('click', () => {
      deleteTargetId = null;
      confirmModal.classList.remove('show');
    });

    document.getElementById('yesConfirmBtn').addEventListener('click', async () => {
      if (deleteTargetId) {
        const btn = document.getElementById('yesConfirmBtn');
        btn.textContent = "Deleting..."; btn.disabled = true;
        try {
          await deleteDoc(doc(db, "events", deleteTargetId));
          confirmModal.classList.remove('show');
        } catch (err) {
          console.error(err); showMessage("Error deleting occasion.");
        } finally {
          btn.textContent = "Delete"; btn.disabled = false;
          deleteTargetId = null;
        }
      }
    });
    
    document.getElementById('openEventModalBtn').addEventListener('click', () => {
      editingEventId = null;
      eventModalTitle.textContent = "Add Occasion";
      document.getElementById('saveEventBtn').textContent = "Save Occasion";
      
      // Pre-fill date input with currently selected date locally formatted
      const y = selectedDate.getFullYear();
      const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const d = String(selectedDate.getDate()).padStart(2, '0');
      eventDateInput.value = `${y}-${m}-${d}`;
      eventTitleInput.value = "";
      eventModal.classList.add('show');
      eventTitleInput.focus();
    });
    
    document.getElementById('cancelEventBtn').addEventListener('click', () => eventModal.classList.remove('show'));
    
    document.getElementById('saveEventBtn').addEventListener('click', async () => {
      const title = eventTitleInput.value.trim();
      const dateVal = eventDateInput.value;
      if (!title || !dateVal) { showMessage("Please enter a title and select a date."); return; }
      
      const btn = document.getElementById('saveEventBtn');
      btn.textContent = "Saving..."; btn.disabled = true;
      try {
        if (editingEventId) {
          await updateDoc(doc(db, "events", editingEventId), { title: title, date: dateVal });
        } else {
          await addDoc(eventsRef, { title: title, date: dateVal, createdAt: serverTimestamp() });
        }
        eventModal.classList.remove('show');
      } catch (err) {
        console.error(err); showMessage("Error saving occasion.");
      } finally {
        btn.textContent = editingEventId ? "Update Occasion" : "Save Occasion"; btn.disabled = false;
      }
    });

    function formatISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      const today = new Date();
      
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      calendarMonthLabel.textContent = `${monthNames[month]} ${year}`;
      
      calendarGrid.innerHTML = `
        <div class="calendar-day-name">Sun</div>
        <div class="calendar-day-name">Mon</div>
        <div class="calendar-day-name">Tue</div>
        <div class="calendar-day-name">Wed</div>
        <div class="calendar-day-name">Thu</div>
        <div class="calendar-day-name">Fri</div>
        <div class="calendar-day-name">Sat</div>
      `;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Empty cells before start of month
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'calendar-day empty';
        calendarGrid.appendChild(emptyDiv);
      }

      // Populate days
      for (let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'calendar-day';
        dayDiv.textContent = i;
        
        // Check states
        const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        const isSelected = (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear());
        
        if (isToday) dayDiv.classList.add('today');
        if (isSelected) dayDiv.classList.add('selected');

        // Check if day has events
        const checkDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const hasEvent = calendarEvents.some(e => e.date === checkDateStr);
        if (hasEvent) {
          const dot = document.createElement('div');
          dot.className = 'event-dot';
          dayDiv.appendChild(dot);
        }

        dayDiv.addEventListener('click', () => {
          selectedDate = new Date(year, month, i);
          renderCalendar(); // Re-render to highlight
          renderSelectedEvents();
        });

        calendarGrid.appendChild(dayDiv);
      }
      
      renderSelectedEvents();
    }

    // Calendar Navigation Listeners
    document.getElementById('prevMonthBtn').addEventListener('click', () => { currentCalDate.setMonth(currentCalDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextMonthBtn').addEventListener('click', () => { currentCalDate.setMonth(currentCalDate.getMonth() + 1); renderCalendar(); });
    document.getElementById('prevYearBtn').addEventListener('click', () => { currentCalDate.setFullYear(currentCalDate.getFullYear() - 1); renderCalendar(); });
    document.getElementById('nextYearBtn').addEventListener('click', () => { currentCalDate.setFullYear(currentCalDate.getFullYear() + 1); renderCalendar(); });

    function renderSelectedEvents() {
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      selectedDateLabel.textContent = `${selectedDate.getDate()} ${monthNames[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
      
      eventsListContainer.innerHTML = '';
      const selectedDateStr = formatISODate(selectedDate);
      const daysEvents = calendarEvents.filter(e => e.date === selectedDateStr);

      if (daysEvents.length === 0) {
        eventsListContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px 0;">No entries for this date.</div>`;
        return;
      }

      daysEvents.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="event-details" dir="auto">
            <div style="font-weight:700; font-size:1.1rem; color:var(--text-main);">${ev.title}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top: 4px;">Occasion</div>
          </div>
          <div style="display: flex; gap: 5px;">
            <button class="event-edit-btn"><i class="fas fa-pen"></i></button>
            <button class="event-del-btn"><i class="fas fa-trash"></i></button>
          </div>
        `;
        
        card.querySelector('.event-edit-btn').addEventListener('click', () => {
          editingEventId = ev.id;
          eventModalTitle.textContent = "Edit Occasion";
          document.getElementById('saveEventBtn').textContent = "Update Occasion";
          eventTitleInput.value = ev.title;
          eventDateInput.value = ev.date;
          eventModal.classList.add('show');
        });

        card.querySelector('.event-del-btn').addEventListener('click', () => {
          deleteTargetId = ev.id;
          confirmModal.classList.add('show');
        });
        
        eventsListContainer.appendChild(card);
      });
    }

    function updateDatesWidget() {
      const today = new Date();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      
      bentoDateNumber.textContent = today.getDate();
      bentoDateMonth.textContent = monthNames[today.getMonth()];
      
      const tMonth = today.getMonth() + 1;
      const tDay = today.getDate();
      const todayIsoStr = formatISODate(today);

      // Check for Anniversaries/Past Entries matching Month & Day
      const anniversaries = calendarEvents.filter(e => {
        const [y, m, d] = e.date.split('-');
        return parseInt(m) === tMonth && parseInt(d) === tDay;
      });

      if (anniversaries.length > 0) {
        const ev = anniversaries[0];
        const [y, m, d] = ev.date.split('-');
        const yearDiff = today.getFullYear() - parseInt(y);
        let yearText = "";
        
        if (yearDiff === 0) {
          yearText = "Today:";
        } else if (yearDiff === 1) {
          yearText = "On this day 1 year ago:";
        } else if (yearDiff === -1) {
          yearText = "On this day in 1 year:";
        } else if (yearDiff < 0) {
          yearText = `On this day in ${Math.abs(yearDiff)} years:`;
        } else {
          yearText = `On this day ${yearDiff} years ago:`;
        }
        
        bentoDatesContext.innerHTML = `<span style="color: var(--primary); font-weight:800;">${yearText}</span><br>${ev.title}`;
      } else {
        // Find next upcoming event
        const futureEvents = calendarEvents.filter(e => e.date > todayIsoStr).sort((a,b) => a.date.localeCompare(b.date));
        if (futureEvents.length > 0) {
          const nextEv = futureEvents[0];
          const [ny, nm, nd] = nextEv.date.split('-');
          bentoDatesContext.innerHTML = `<span style="color: var(--text-muted);">Next up (${parseInt(nd)} ${monthNames[parseInt(nm)-1]}):</span><br>${nextEv.title}`;
        } else {
          bentoDatesContext.innerHTML = `<span style="color: var(--text-muted);">No upcoming dates. Tap to add.</span>`;
        }
      }
    }

    // Firebase Listeners
    onSnapshot(eventsRef, (snapshot) => {
      calendarEvents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderCalendar();
      updateDatesWidget();
    });

    onSnapshot(todoRef, (snapshot) => {
      todoItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderList('todo');
      const pendingTasks = todoItems.filter(i => !i.completed).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      
      bentoTodoCount.textContent = pendingTasks.length;
      if (pendingTasks.length > 0) {
        bentoTodoNext.innerHTML = pendingTasks[0].text;
      } else {
        bentoTodoNext.innerHTML = `All caught up!`;
      }
    });

    onSnapshot(wishlistRef, (snapshot) => {
      wishlistItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderList('wishlist');
      const wishes = wishlistItems.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      
      bentoWishCount.textContent = wishes.length;
      if (wishes.length > 0) {
        bentoWishNext.innerHTML = wishes[0].text;
      } else {
        bentoWishNext.innerHTML = `No wishes yet.`;
      }
    });

    function formatDate(ms) {
      if (!ms) return 'added just now';
      const date = new Date(ms);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `Added ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear().toString().slice(-2)}`;
    }

    function setupListInput(type) {
      const input = document.getElementById(`${type}Input`);
      const addBtn = document.getElementById(`add${type.charAt(0).toUpperCase() + type.slice(1)}Btn`);
      const cancelBtn = document.getElementById(`cancel${type.charAt(0).toUpperCase() + type.slice(1)}EditBtn`);
      const sortSelect = document.querySelector(`.sortSelect[data-list="${type}"]`);

      const resetState = () => {
        if(type === 'todo') editingTodoId = null; else editingWishlistId = null;
        input.value = ""; addBtn.textContent = "Add"; cancelBtn.style.display = "none";
      };
      cancelBtn.addEventListener('click', resetState);
      sortSelect.addEventListener('change', () => renderList(type));

      addBtn.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text) return;
        const targetCollection = type === 'todo' ? todoRef : wishlistRef;
        const targetCollectionName = type === 'todo' ? "tasks" : "wishlist";
        const currentEditingId = type === 'todo' ? editingTodoId : editingWishlistId;

        try {
          addBtn.textContent = "..."; addBtn.disabled = true;
          if (currentEditingId) {
            await updateDoc(doc(db, targetCollectionName, currentEditingId), { text: text });
            resetState();
          } else {
            await addDoc(targetCollection, { text: text, completed: false, createdAt: serverTimestamp() });
            input.value = "";
          }
        } catch (error) {
          console.error(error); showMessage("Error saving item.");
        } finally {
          if (!currentEditingId) addBtn.textContent = "Add";
          addBtn.disabled = false;
        }
      });
      input.addEventListener("keypress", (e) => { if (e.key === "Enter") addBtn.click(); });
    }

    setupListInput('todo');
    setupListInput('wishlist');

    document.addEventListener('touchstart', (e) => {
      if (!e.target.closest('.list-item-wrapper')) {
         document.querySelectorAll('.list-item.swiped').forEach(el => {
            el.style.transform = 'translateX(0)'; el.classList.remove('swiped');
         });
      }
    }, {passive: true});

    function renderList(type) {
      const container = document.getElementById(`${type}ListContainer`);
      const items = type === 'todo' ? [...todoItems] : [...wishlistItems];
      const targetCollectionName = type === 'todo' ? "tasks" : "wishlist";
      const sortSelect = document.querySelector(`.sortSelect[data-list="${type}"]`);
      
      container.innerHTML = "";
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas ${type === 'todo' ? 'fa-check-circle' : 'fa-star'}"></i><span dir="auto">${type === 'todo' ? "You're all caught up!" : "Your list is empty."}</span></div>`;
        return;
      }

      const sortVal = sortSelect.value;
      if (sortVal === "date-desc") items.sort((a, b) => (b.createdAt?.seconds || Date.now()) - (a.createdAt?.seconds || Date.now()));
      else if (sortVal === "date-asc") items.sort((a, b) => (a.createdAt?.seconds || Date.now()) - (b.createdAt?.seconds || Date.now()));
      else if (sortVal === "name-asc") items.sort((a, b) => (a.text || "").localeCompare(b.text || ""));
      else if (sortVal === "name-desc") items.sort((a, b) => (b.text || "").localeCompare(a.text || ""));

      items.sort((a, b) => (a.completed === b.completed) ? 0 : a.completed ? 1 : -1);

      items.forEach((item, index) => {
        const liContainer = document.createElement("li");
        liContainer.className = "list-item-wrapper";
        liContainer.style.animationDelay = `${index * 0.05}s`;

        const deleteBg = document.createElement("div");
        deleteBg.className = "delete-bg";
        deleteBg.innerHTML = '<i class="fas fa-trash"></i>';
        
        deleteBg.addEventListener('click', async () => {
             const listEl = liContainer.querySelector('.list-item');
             listEl.style.transform = `translateX(-100%)`;
             setTimeout(async () => {
                 liContainer.style.display = 'none';
                 await deleteDoc(doc(db, targetCollectionName, item.id));
                 if (type === 'todo' && editingTodoId === item.id) { editingTodoId = null; document.getElementById('cancelTodoEditBtn').click(); }
                 if (type === 'wishlist' && editingWishlistId === item.id) { editingWishlistId = null; document.getElementById('cancelWishlistEditBtn').click(); }
             }, 300);
        });

        const li = document.createElement("div");
        li.className = `list-item ${item.completed ? 'completed' : ''}`;
        
        const cbWrapper = document.createElement("label");
        cbWrapper.className = "checkbox-wrapper";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = item.completed;
        cb.addEventListener("change", async () => { await updateDoc(doc(db, targetCollectionName, item.id), { completed: cb.checked }); });
        const customCb = document.createElement("div"); customCb.className = "custom-checkbox";
        cbWrapper.appendChild(cb); cbWrapper.appendChild(customCb);

        const textWrapper = document.createElement("div"); textWrapper.className = "item-text"; textWrapper.setAttribute('dir', 'auto'); 
        const span = document.createElement("span"); span.className = "main-text"; span.textContent = item.text;
        const dateSpan = document.createElement("span"); dateSpan.className = "date-text";
        dateSpan.textContent = formatDate(item.createdAt?.seconds ? item.createdAt.seconds * 1000 : null);
        textWrapper.appendChild(span); textWrapper.appendChild(dateSpan);
        
        const actions = document.createElement("div"); actions.className = "actions";
        const editBtn = document.createElement("button"); editBtn.innerHTML = '<i class="fas fa-pen"></i>';
        editBtn.addEventListener("click", () => {
          const input = document.getElementById(`${type}Input`);
          input.value = item.text;
          if(type === 'todo') editingTodoId = item.id; else editingWishlistId = item.id;
          document.getElementById(`add${type.charAt(0).toUpperCase() + type.slice(1)}Btn`).textContent = "Update";
          document.getElementById(`cancel${type.charAt(0).toUpperCase() + type.slice(1)}EditBtn`).style.display = "block";
          input.focus(); li.style.transform = 'translateX(0)'; li.classList.remove('swiped');
        });
        actions.appendChild(editBtn);
        
        li.appendChild(cbWrapper); li.appendChild(textWrapper); li.appendChild(actions);
        liContainer.appendChild(deleteBg); liContainer.appendChild(li); container.appendChild(liContainer);

        let startX = 0; let currentX = 0; let isDragging = false;
        li.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX; isDragging = true; li.style.transition = 'none'; 
          document.querySelectorAll('.list-item.swiped').forEach(el => { if (el !== li) { el.style.transform = 'translateX(0)'; el.classList.remove('swiped'); } });
        }, {passive: true});

        li.addEventListener('touchmove', (e) => {
          if (!isDragging) return;
          const x = e.touches[0].clientX; currentX = x - startX;
          if (currentX < 0) { li.style.transform = `translateX(${Math.max(currentX, -75)}px)`; }
        }, {passive: true});

        const handleSwipeEnd = () => {
          if (!isDragging) return;
          isDragging = false; li.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          if (currentX < -30) { li.style.transform = `translateX(-75px)`; li.classList.add('swiped'); }
          else { li.style.transform = `translateX(0)`; li.classList.remove('swiped'); }
          currentX = 0;
        };
        li.addEventListener('touchend', handleSwipeEnd); li.addEventListener('touchcancel', handleSwipeEnd);
      });
    }
  </script>
</body>
</html>
